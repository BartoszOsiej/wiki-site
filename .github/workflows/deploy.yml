name: deploy-wiki
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      # wrangler-action@v3 woła `npx wrangler@4` i pada na "no YES option",
      # wiec instalujemy go lokalnie i wołamy wprost.
      - run: npm install --no-save wrangler@latest
      - name: Fetch the GitHub Wiki (source of truth)
        run: git clone --depth 1 https://github.com/BartoszOsiej/BartoszOsiej.wiki.git wiki-src
      - name: Build static docs
        run: node build.js ./wiki-src
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}