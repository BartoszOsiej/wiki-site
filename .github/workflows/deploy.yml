name: deploy-wiki
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install
      - name: Fetch the GitHub Wiki (source of truth)
        run: git clone --depth 1 https://github.com/BartoszOsiej/BartoszOsiej.wiki.git wiki-src
      - name: Build static docs
        run: node build.js ./wiki-src
      # wrangler-action@v3 czyta token z ENV, nie z wejscia `apiToken`
      - uses: cloudflare/wrangler-action@v3
        with:
          command: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
