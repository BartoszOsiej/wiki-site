[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Trasy MUSZA być na najwyższym poziomie TOML — wcześniej były zagnieżdżone
# w [assets], przez co wrangler je ignorował ("Unexpected fields found in
# assets field: routes") i custom domain nie był redeployowany.
routes = [
  { pattern = "wiki.hartwell-labs.pl", custom_domain = true }
]