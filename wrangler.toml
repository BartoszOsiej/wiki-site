name = "hartwell-wiki"
compatibility_date = "2026-10-01"
account_id = "29ee063c29d9e8f27a8863fadcaa9073"

# Trasy MUSZĄ być PRZED tabelą [assets] — w TOML wszystko po nagłówku `[assets]`
# należy do tej tabeli, więc `routes` zapisane pod nią wrangler odrzucał
# ("Unexpected fields found in assets field: routes") i custom domain nie był
# redeployowany.
routes = [
  { pattern = "wiki.hartwell-labs.pl", custom_domain = true }
]

[assets]
directory = "./dist"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"